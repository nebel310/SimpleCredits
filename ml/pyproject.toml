[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "simplecredits-ml"
version = "0.1.0"
description = "Credit scoring and policy engine for the SimpleCredits conveyor"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.1.0",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "catboost==1.2.10",
  "grpcio==1.84.1",
  "grpcio-tools==1.84.1",
  "grpcio-health-checking==1.84.1",
  "protobuf==7.36.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
tracking = ["mlflow-skinny==3.17.2"]

[project.scripts]
simplecredits-train = "simplecredits.ml.training.train:main"
simplecredits-catboost = "simplecredits.ml.training.catboost:main"
simplecredits-scoring = "simplecredits.ml.serving.server:main"
simplecredits-compare = "simplecredits.ml.tracking.compare:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
