  /mock/fns/{inn}:
    get:
      tags: [Mock]
      summary: Мок ФНС
      security: []
      parameters:
        - { name: inn, in: path, required: true, schema: { type: string } }
        - { name: fail, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Налоговые данные
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SFnsResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /mock/bki/{inn}:
    get:
      tags: [Mock]
      summary: Мок БКИ
      security: []
      parameters:
        - { name: inn, in: path, required: true, schema: { type: string } }
        - { name: fail, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Кредитная история
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SBkiResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }