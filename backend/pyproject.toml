    "anyio>=4.15.1",
    "asyncpg>=0.32.0",
    "attrs>=26.1.0",
    "bcrypt>=4.0.1,<4.1",
    "botocore>=1.43.106",
    "click>=8.5.0",
    "colorama>=0.4.6",
    "dnspython>=2.9.0",
    "ecdsa>=0.19.2",
    "email-validator>=2.3.0",
    "fastapi>=0.159.1",
    "frozenlist>=1.8.0",
    "googleapis-common-protos>=1.76.0",
    "greenlet>=3.5.6",
    "grpcio>=1.84.1",
    "grpcio-tools>=1.84.1",
    "h11>=0.16.0",
    "idna>=3.20",
    "itsdangerous>=2.2.0",
    "jmespath>=1.1.0",
    "multidict>=6.9.1",
    "passlib>=1.7.4",
    "propcache>=0.5.4",
    "protobuf>=7.36.2",
    "pyasn1>=0.6.4",
    "pydantic>=2.14.1",
    "pydantic-core>=2.50.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-multipart>=0.0.32",
    "rsa>=4.9.1",
    "six>=1.17.0",
    "sniffio>=1.3.1",
    "sqlalchemy>=2.1.6",
