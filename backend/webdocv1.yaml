openapi: 3.0.3
info:
  title: SimpleCredits API
  version: 1.0.0
  description: |
    API умного кредитного кабинета предпринимателя (хакатон Альфа-Будущее 2026).

    - Базовый URL: `http://localhost:3001`
    - Формат данных: JSON (кроме загрузки/скачивания файлов — multipart/octet-stream)
    - Все защищённые эндпоинты требуют `Authorization: Bearer <access_token>`
    - `access_token` живёт 15 минут, `refresh_token` — 7 дней
    - Ошибки приходят в едином формате `{"detail": "..."}`

servers:
  - url: http://localhost:3001
    description: Локальная разработка

tags:
  - name: Auth
    description: Регистрация, вход, профиль пользователя
  - name: Files
    description: Загрузка и скачивание файлов (документы, аватарки)
  - name: Scoring
    description: Кредитные заявки, скоринг, кредитное решение

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ============================================================
    # AUTH
    # ============================================================

    SUserRegister:
      type: object
      required: [username, email, password, password_confirm]
      properties:
        username: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string }
        password_confirm: { type: string, description: "Должен совпадать с password" }
      example:
        username: john_doe
        email: john@example.com
        password: securepassword123
        password_confirm: securepassword123

    SUserLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
      example:
        email: john@example.com
        password: securepassword123

    SUserUpdate:
      type: object
      description: "Частичное обновление. Должно быть передано хотя бы одно поле."
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email }
        avatar_id: { type: integer, nullable: true, description: "ID файла из /files/, загруженного этим же пользователем" }
        bio: { type: string, maxLength: 500, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        gender: { type: string, enum: [male, female], nullable: true }
      example:
        username: new_name
        bio: "Привет, я новый пользователь"
        birth_date: "2000-01-01"
        gender: male

    SUser:
      type: object
      required: [id, username, email, role, created_at]
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        avatar_id: { type: integer, nullable: true }
        bio: { type: string, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        gender: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      example:
        id: 1
        username: john_doe
        email: john@example.com
        role: user
        avatar_id: null
        bio: null
        birth_date: null
        gender: null
        created_at: "2024-01-01T12:00:00Z"

    SUserListResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/SUser' }
        next_cursor: { type: string, nullable: true, description: "Передать в query-параметре cursor для следующей страницы" }
        previous_cursor: { type: string, nullable: true }

    RegisterResponse:
      type: object
      required: [success, user_id, message]
      properties:
        success: { type: boolean }
        user_id: { type: integer }
        message: { type: string }
      example:
        success: true
        user_id: 1
        message: "Регистрация прошла успешно"

    LoginResponse:
      type: object
      required: [success, message, access_token, refresh_token, token_type]
      properties:
        success: { type: boolean }
        message: { type: string }
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: bearer }
      example:
        success: true
        message: "Вы вошли в аккаунт"
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type: bearer

    RefreshResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }

    LogoutResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    # ============================================================
    # FILES
    # ============================================================

    SFileResponse:
      type: object
      required: [id, object_key, original_name, size, uploaded_by, created_at]
      properties:
        id: { type: integer }
        object_key: { type: string, description: "Внутренний ключ в S3, не показывать пользователю" }
        original_name: { type: string }
        size: { type: integer, description: "Размер в байтах" }
        uploaded_by: { type: integer, description: "user_id загрузившего" }
        content_type: { type: string, nullable: true }
        extension: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      example:
        id: 1
        object_key: a1b2c3d4e5f6.png
        original_name: фото.png
        size: 204800
        uploaded_by: 2
        content_type: image/png
        extension: png
        created_at: "2024-01-01T12:00:00Z"

    # ============================================================
    # SCORING
    # ============================================================

    SApplication:
      type: object
      required: [product_type, requested_amount_rub, term_months, purpose, segment, submitted_at]
      properties:
        product_type:
          type: string
          enum: [microloan, term_loan, overdraft, credit_line, leasing]
        requested_amount_rub:
          type: integer
          minimum: 0
        term_months:
          type: integer
          minimum: 1
        purpose:
          type: string
          enum: [working_capital, equipment, expansion, refinancing, other]
        segment:
          type: string
          enum: [micro, small]
        submitted_at:
          type: string
          format: date-time

    SCompany:
      type: object
      required: [inn, ogrn, legal_name, legal_form, okved, region, registration_date, employee_count]
      properties:
        inn: { type: string, minLength: 10, maxLength: 12 }
        ogrn: { type: string, minLength: 13, maxLength: 15 }
        legal_name: { type: string }
        legal_form:
          type: string
          enum: [llc, individual_entrepreneur, joint_stock_company]
        okved: { type: string, description: "ОКВЭД, например 62.01" }
        region: { type: string, description: "Название региона, например Москва" }
        registration_date: { type: string, format: date-time }
        employee_count: { type: integer, minimum: 0 }

    SFinancials:
      type: object
      required:
        [annual_revenue_rub, annual_net_profit_rub, ebitda_rub, total_debt_rub,
         monthly_revenue_rub, monthly_expenses_rub, accounts_receivable_rub,
         cash_balance_rub, period_end]
      properties:
        annual_revenue_rub: { type: integer, minimum: 0 }
        annual_net_profit_rub: { type: integer, description: "Может быть отрицательным" }
        ebitda_rub: { type: integer, description: "Может быть отрицательным" }
        total_debt_rub: { type: integer, minimum: 0 }
        monthly_revenue_rub: { type: integer, minimum: 0 }
        monthly_expenses_rub: { type: integer, minimum: 0 }
        accounts_receivable_rub: { type: integer, minimum: 0 }
        cash_balance_rub: { type: integer, minimum: 0 }
        period_end: { type: string, format: date-time }

    SCreditHistory:
      type: object
      required:
        [active_obligations_count, total_outstanding_rub, monthly_debt_payments_rub,
         max_days_past_due_12m, has_current_past_due, credit_utilization,
         closed_obligations_count, applications_last_6m]
      properties:
        active_obligations_count: { type: integer, minimum: 0 }
        total_outstanding_rub: { type: integer, minimum: 0 }
        monthly_debt_payments_rub: { type: integer, minimum: 0 }
        max_days_past_due_12m: { type: integer, minimum: 0, maximum: 365 }
        has_current_past_due: { type: boolean }
        credit_utilization: { type: number, minimum: 0, maximum: 1 }
        closed_obligations_count: { type: integer, minimum: 0 }
        applications_last_6m: { type: integer, minimum: 0 }

    SScoreApplicationRequest:
      type: object
      required: [application, company, financials, credit_history]
      properties:
        application: { $ref: '#/components/schemas/SApplication' }
        company: { $ref: '#/components/schemas/SCompany' }
        financials: { $ref: '#/components/schemas/SFinancials' }
        credit_history: { $ref: '#/components/schemas/SCreditHistory' }
      example:
        application:
          product_type: term_loan
          requested_amount_rub: 1500000
          term_months: 24
          purpose: equipment
          segment: small
          submitted_at: "2026-03-15T10:00:00Z"
        company:
          inn: "7701234567"
          ogrn: "1027700132195"
          legal_name: "ООО Ромашка"
          legal_form: llc
          okved: "62.01"
          region: Москва
          registration_date: "2018-04-12T00:00:00Z"
          employee_count: 25
        financials:
          annual_revenue_rub: 42000000
          annual_net_profit_rub: 6500000
          ebitda_rub: 8200000
          total_debt_rub: 3000000
          monthly_revenue_rub: 3500000
          monthly_expenses_rub: 2800000
          accounts_receivable_rub: 1200000
          cash_balance_rub: 900000
          period_end: "2025-12-31T00:00:00Z"
        credit_history:
          active_obligations_count: 2
          total_outstanding_rub: 3000000
          monthly_debt_payments_rub: 120000
          max_days_past_due_12m: 0
          has_current_past_due: false
          credit_utilization: 0.35
          closed_obligations_count: 4
          applications_last_6m: 1

    SReasonCode:
      type: object
      required: [code, description, feature, impact, contribution]
      properties:
        code: { type: string, example: DEBT_BURDEN }
        description: { type: string, example: "Высокая долговая нагрузка" }
        feature: { type: string, example: debt_to_revenue }
        impact: { type: string, enum: [positive, negative, neutral] }
        contribution: { type: number, example: 0.5 }

    SDecisionCondition:
      type: object
      required: [code, description, recommended_amount_rub]
      properties:
        code: { type: string, example: REDUCE_AMOUNT }
        description: { type: string, example: "Снизить сумму финансирования относительно запрошенной" }
        recommended_amount_rub: { type: integer, example: 5000000 }

    SDecisionResult:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, approve_with_conditions, manual_review, decline]
        reason_codes:
          type: array
          items: { type: string }
          description: "Коды политики, например CURRENT_PAST_DUE, HIGH_RISK_SCORE, LOAN_TO_REVENUE_REDUCTION"
        conditions:
          type: array
          items: { $ref: '#/components/schemas/SDecisionCondition' }

    SScoreApplicationResponse:
      type: object
      required: [application_id, score, pd, risk_grade, reason_codes, model_version]
      properties:
        application_id: { type: string, description: "Генерирует backend, возвращается клиенту" }
        score: { type: integer, minimum: 0, maximum: 1000 }
        pd: { type: number, minimum: 0, maximum: 1, description: "Probability of default" }
        risk_grade: { type: string, enum: [A, B, C, D, E] }
        reason_codes:
          type: array
          items: { $ref: '#/components/schemas/SReasonCode' }
        model_version: { type: string, example: scorecard-linear-v1 }
        scored_at: { type: string, format: date-time, nullable: true }
        decision: { allOf: [{ $ref: '#/components/schemas/SDecisionResult' }], nullable: true }
      example:
        application_id: 8a3f9c2e1b4d4f5a9c7d6b5a4e3f2d1c
        score: 712
        pd: 0.0421
        risk_grade: B
        reason_codes:
          - code: CURRENT_PAST_DUE
            description: "Нет текущих просрочек"
            feature: has_current_past_due
            impact: positive
            contribution: -0.4
        model_version: scorecard-linear-v1
        scored_at: "2026-03-15T10:00:01Z"
        decision:
          decision: approve
          reason_codes: []
          conditions: []

    SBatchScoreApplicationsRequest:
      type: object
      required: [applications]
      properties:
        applications:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/SScoreApplicationRequest' }

    SBatchScoreApplicationsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SScoreApplicationResponse' }

    SModelInfoResponse:
      type: object
      required: [model_version, model_type]
      properties:
        model_version: { type: string }
        model_type: { type: string }
        trained_at: { type: string, format: date-time, nullable: true }
        features:
          type: array
          items: { type: string }
        metrics:
          type: object
          additionalProperties: { type: number }

    SApplicationDetail:
      type: object
      required: [application_id, status, created_at, application, company, financials, credit_history]
      properties:
        application_id: { type: string }
        status:
          type: string
          enum: [pending, scored, failed]
          description: "pending — создана, ожидает ответа ML; scored — результат сохранён; failed — ML вернул ошибку"
        created_at: { type: string, format: date-time }
        application: { $ref: '#/components/schemas/SApplication' }
        company: { $ref: '#/components/schemas/SCompany' }
        financials: { $ref: '#/components/schemas/SFinancials' }
        credit_history: { $ref: '#/components/schemas/SCreditHistory' }
        scoring_result: { allOf: [{ $ref: '#/components/schemas/SScoreApplicationResponse' }], nullable: true }

    SApplicationListResponse:
      type: object
      required: [applications]
      properties:
        applications:
          type: array
          items: { $ref: '#/components/schemas/SApplicationDetail' }
        next_cursor: { type: string, nullable: true }
        previous_cursor: { type: string, nullable: true }

    # ============================================================
    # COMMON
    # ============================================================

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
      example:
        detail: "Сообщение об ошибке"

    ValidationErrorResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
      example:
        detail: "Пользователь с таким email уже существует"

    SuccessResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
      example:
        detail: "Файл успешно удалён"

  responses:
    Unauthorized:
      description: "Не авторизован"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: "Недостаточно прав"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: "Объект не найден"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: "Ошибка валидации запроса"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
    InternalError:
      description: "Внутренняя ошибка сервера"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: "Ошибка внешнего сервиса (ML / S3)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GatewayTimeout:
      description: "Таймаут внешнего сервиса (ML)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

# ================================================================
# PATHS
# ================================================================

paths:

  # ============================================================
  # AUTH
  # ============================================================

  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация нового пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SUserRegister' }
      responses:
        '201':
          description: "Пользователь зарегистрирован"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400':
          description: "Email уже занят или пароли не совпадают"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '422':
          description: "Схема не прошла валидацию Pydantic"
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход в систему
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SUserLogin' }
      responses:
        '200':
          description: "Успешный вход, выданы токены"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: "Неверный email или пароль"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновить access токен
      description: "Refresh токен передаётся **в query-параметре**, не в теле"
      security: []
      parameters:
        - name: refresh_token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: "Новый access_token"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
        '400':
          description: "Неверный или просроченный refresh_token"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Выход из системы
      description: "Добавляет access токен в чёрный список и отзывает refresh токен пользователя"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "Выход выполнен"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Получить данные текущего пользователя
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "Профиль"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Auth]
      summary: Обновить профиль текущего пользователя
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SUserUpdate' }
      responses:
        '200':
          description: "Обновлённый профиль"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SUser' }
        '400':
          description: "Email уже занят / файл-аватар не принадлежит пользователю"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/users:
    get:
      tags: [Auth]
      summary: Список пользователей (курсорная пагинация)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, nullable: true }
        - name: direction
          in: query
          schema: { type: string, enum: [forward, backward], default: forward }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: "Страница пользователей"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SUserListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================
  # FILES
  # ============================================================

  /files/:
    post:
      tags: [Files]
      summary: Загрузить файл
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: "Файл сохранён"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SFileResponse' }
        '400':
          description: "Ошибка чтения файла или не удалось определить MIME"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /files/{file_id}:
    get:
      tags: [Files]
      summary: Скачать файл
      description: "Поддерживает Range-запросы (заголовок `Range: bytes=start-end`). Возвращает бинарный поток."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: "Полный файл"
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: "Частичное содержимое (Range)"
          headers:
            Content-Range:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: "Невалидный Range"
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      tags: [Files]
      summary: Удалить файл
      security: [{ bearerAuth: [] }]
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: "Файл удалён"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /files/{file_id}/info:
    get:
      tags: [Files]
      summary: Метаданные файла
      security: [{ bearerAuth: [] }]
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: "Метаданные"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SFileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ============================================================
  # SCORING
  # ============================================================

  /scoring/applications:
    post:
      tags: [Scoring]
      summary: Создать кредитную заявку и получить решение
      description: |
        Backend:
        1. Генерирует `application_id` и сохраняет заявку со статусом `pending`
        2. Отправляет её в ML-сервис по gRPC
        3. Сохраняет результат скоринга
        4. Возвращает `SScoreApplicationResponse` (не `SApplicationDetail`)

        При ошибке ML заявка остаётся с `status=failed`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SScoreApplicationRequest' }
      responses:
        '201':
          description: "Заявка создана, результат скоринга получен"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SScoreApplicationResponse' }
        '400':
          description: "ML-сервис отклонил запрос (INVALID_ARGUMENT)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: "Тело не прошло валидацию Pydantic"
        '502': { $ref: '#/components/responses/BadGateway' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
    get:
      tags: [Scoring]
      summary: Список заявок текущего пользователя
      description: "Курсорная пагинация. Возвращает заявки вместе с их результатами скоринга."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, nullable: true }
        - name: direction
          in: query
          schema: { type: string, enum: [forward, backward], default: forward }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: "Страница заявок"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SApplicationListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /scoring/applications/{application_id}:
    get:
      tags: [Scoring]
      summary: Детали заявки с результатом скоринга
      description: "Пользователь видит только свои заявки. Администратор видит любые."
      security: [{ bearerAuth: [] }]
      parameters:
        - name: application_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: "Заявка и её результат"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SApplicationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scoring/batch:
    post:
      tags: [Scoring]
      summary: Пакетный скоринг без сохранения в БД
      description: "Возвращает результаты, но не создаёт записей в `applications`. Удобно для превью."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SBatchScoreApplicationsRequest' }
      responses:
        '200':
          description: "Результаты пакетного скоринга"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SBatchScoreApplicationsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /scoring/model-info:
    get:
      tags: [Scoring]
      summary: Информация о загруженной ML-модели
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: "Версия, тип, признаки и метрики модели"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SModelInfoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }